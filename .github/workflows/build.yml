name: Build FlickerDS Kernel (alioth) — matriz de diagnóstico

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:
    inputs:
      device:
        description: 'Device codename'
        required: false
        default: 'alioth'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        variant: [full, nohooks, control]
    env:
      DEVICE: ${{ github.event.inputs.device || 'alioth' }}
      KERNEL_REPO: https://github.com/otaviomorais/kernel_xiaomi_sm8250-1
      KERNEL_BRANCH: magictime-droidspaces
      FRAGMENTS: "vendor/xiaomi/magictime-common.config vendor/xiaomi/droidspaces.config"
    concurrency:
      group: flickerds-${{ github.ref }}-${{ matrix.variant }}
      cancel-in-progress: false

    steps:
      - name: Checkout this repo (patches + anykernel)
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources
          echo "deb http://archive.ubuntu.com/ubuntu/ noble main universe" | sudo tee /etc/apt/sources.list.d/fast.list
          echo "deb http://archive.ubuntu.com/ubuntu/ noble-updates main universe" | sudo tee -a /etc/apt/sources.list.d/fast.list
          echo "deb http://security.ubuntu.com/ubuntu/ noble-security main universe" | sudo tee -a /etc/apt/sources.list.d/fast.list
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            flex bison bc zip unzip file python3 python-is-python3 \
            libssl-dev libncurses-dev kmod cpio
          sudo ln -sf /usr/bin/python3 /usr/bin/python2 || true

      - name: Clone base kernel (otaviomorais fork, with KernelSU submodule)
        run: |
          git clone --depth 1 --branch ${{ env.KERNEL_BRANCH }} \
            ${{ env.KERNEL_REPO }}.git kernel
          cd kernel
          git submodule update --init --recursive --depth=1

      - name: Deepen KernelSU history (version = rev-list count)
        run: |
          cd kernel/KernelSU-Next
          git fetch --unshallow --tags 2>/dev/null \
            || git fetch --deepen=300 origin 2>/dev/null || true

      - name: "Apply patches (variant: ${{ matrix.variant }})"
        run: |
          cd kernel
          apply(){ echo "==> $(basename "$1")"; git apply --check "$1" && git apply "$1" \
            || { echo "::error::failed to apply $1"; exit 1; }; }

          # 0001 sempre (EEVDF estrito)
          apply ../repo/patches/0001-enable-full-eevdf.patch

          if [ "${{ matrix.variant }}" != "control" ]; then
            apply ../repo/patches/0002-mm-backport-mglru.patch
          fi

          if [ "${{ matrix.variant }}" = "nohooks" ]; then
            apply ../repo/patches/0003-remove-mglru-sched-hooks.patch
          fi

          grep -q 'SCHED_FEAT(ENFORCE_ELIGIBILITY, true)' kernel/sched/features.h && \
            echo "ENFORCE_ELIGIBILITY=true confirmed"

          if [ "${{ matrix.variant }}" != "control" ]; then
            grep -q 'config LRU_GEN$' mm/Kconfig && echo "MGLRU presente"
          fi

          # Branding (CRLF-immune)
          sed -i 's/CONFIG_LOCALVERSION="-MagicTime"/CONFIG_LOCALVERSION="-FlickerDS"/' \
            arch/arm64/configs/vendor/xiaomi/magictime-common.config
          grep -q 'FlickerDS' arch/arm64/configs/vendor/xiaomi/magictime-common.config && \
            echo "Branding OK"

          # KSU selinux_hide: kprobe helpers só existem com KSU_KPROBES_HOOK
          # (indisponível no 4.19 — sem HAVE_SYSCALL_TRACEPOINTS)
          sed -i 's/#if defined(CONFIG_KPROBES)$/#if defined(CONFIG_KPROBES) \&\& defined(KSU_KPROBES_HOOK)/' \
            drivers/kernelsu/feature/selinux_hide.c

      - name: Cache Clang toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: toolchain/clang
          key: ${{ runner.os }}-clang20-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-clang20-

      - name: Download Clang (ZyCromerZ)
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchain
          cd toolchain
          curl -L -o clang.tar.gz \
            https://github.com/ZyCromerZ/Clang/releases/download/20.0.0git-20250129-release/Clang-20.0.0git-20250129.tar.gz
          mkdir -p clang && tar -xzf clang.tar.gz -C clang
          rm clang.tar.gz
          CLANG_BIN="$(pwd)/clang/bin"
          if [ ! -x "$CLANG_BIN/clang" ]; then
            CLANG_BIN="$(cd "$(find clang -name clang -path '*/bin/*' -exec dirname {} \; | head -1)" && pwd)"
          fi
          echo "$CLANG_BIN" >> "$GITHUB_PATH"

      - name: Cache GCC cross-compiler
        id: cache-gcc
        uses: actions/cache@v4
        with:
          path: toolchain/gcc
          key: ${{ runner.os }}-gcc-aarch64-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-gcc-aarch64-

      - name: Download GCC cross-compiler
        if: steps.cache-gcc.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchain/gcc
          cd toolchain/gcc
          curl -L -o gcc.tar.gz \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/android12-release.tar.gz
          tar -xf gcc.tar.gz || true
          rm gcc.tar.gz
          GCC_BIN="$(find . -name aarch64-linux-android-gcc -exec dirname {} \; | head -1)"
          if [ -n "$GCC_BIN" ]; then
            echo "$GCC_BIN" >> "$GITHUB_PATH"
          fi

      - name: Restore cached toolchains
        if: steps.cache-clang.outputs.cache-hit == 'true' || steps.cache-gcc.outputs.cache-hit == 'true'
        run: |
          if [ "${{ steps.cache-clang.outputs.cache-hit }}" == "true" ]; then
            CLANG_BIN="$(pwd)/toolchain/clang/bin"
            if [ ! -x "$CLANG_BIN/clang" ]; then
              CLANG_BIN="$(cd "$(find toolchain/clang -name clang -path '*/bin/*' -exec dirname {} \; | head -1)" && pwd)"
            fi
            echo "$CLANG_BIN" >> "$GITHUB_PATH"
          fi
          if [ "${{ steps.cache-gcc.outputs.cache-hit }}" == "true" ]; then
            GCC_BIN="$(find toolchain/gcc -name aarch64-linux-android-gcc -exec dirname {} \; | head -1)"
            if [ -n "$GCC_BIN" ]; then
              echo "$GCC_BIN" >> "$GITHUB_PATH"
            fi
          fi

      - name: Setup swap for OOM protection
        run: |
          SWAP="${RUNNER_TEMP}/swapfile"
          sudo rm -f "$SWAP"
          sudo fallocate -l 8G "$SWAP" || sudo dd if=/dev/zero of="$SWAP" bs=1M count=8192 status=progress
          sudo chmod 600 "$SWAP"
          sudo mkswap "$SWAP"
          sudo swapon "$SWAP"
          free -h

      - name: Configure kernel (defconfig + fragments)
        run: |
          cd kernel
          export ARCH=arm64
          export KBUILD_BUILD_USER=FlickerDS
          export KBUILD_BUILD_HOST=github

          MAKE_ARGS=(O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
                     CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm
                     OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
                     HOSTCC=gcc PYTHON=python3)

          make "${MAKE_ARGS[@]}" "${DEVICE}_defconfig"

          FRAG_PATHS=()
          for f in $FRAGMENTS; do
            p="arch/arm64/configs/$f"
            [ -f "$p" ] || { echo "::error::fragment not found: $p"; exit 1; }
            FRAG_PATHS+=("$p")
          done
          ./scripts/kconfig/merge_config.sh -m -O out out/.config "${FRAG_PATHS[@]}"

          # KPROBES explicit: KSU depends on it and the base defconfig omits it
          scripts/config --file out/.config -e KPROBES -e KRETPROBES

          if [ "${{ matrix.variant }}" != "control" ]; then
            # bisec v1.1.x: aging do MGLRU OFF por default
            scripts/config --file out/.config -d LRU_GEN_ENABLED
          fi

          make "${MAKE_ARGS[@]}" olddefconfig

          echo "===== requested symbols that did not land ====="
          NOT_APPLIED=0
          for p in "${FRAG_PATHS[@]}"; do
            while IFS= read -r line; do
              line="${line%$'\r'}"
              case "$line" in ''|'#'*) continue ;; esac
              sym="${line%%=*}"
              want="${line#*=}"
              grep -qxF "$line" out/.config && continue
              if [ "$want" = n ] && ! grep -q "^$sym=" out/.config; then continue; fi
              eff=$(grep -E "^($sym=|# $sym is not set)" out/.config \
                    || echo '<symbol does not exist>')
              echo "  $line -> $eff"
              NOT_APPLIED=$((NOT_APPLIED+1))
            done < "$p"
          done
          [ "$NOT_APPLIED" -eq 0 ] || echo "::warning::$NOT_APPLIED symbol(s) did not land as requested"

          echo "==> Config summary (${{ matrix.variant }}):"
          grep -E "CONFIG_KSU=|CONFIG_KPROBES=|CONFIG_MEMCG=|CONFIG_PSI=|CONFIG_USER_NS=|CONFIG_FAIR_GROUP_SCHED=|CONFIG_VETH=|CONFIG_OVERLAY_FS=|CONFIG_LRU_GEN=|CONFIG_LOCALVERSION=" out/.config || true

          echo "==> Validating critical configs..."
          FAILED=0
          REQ="CONFIG_KSU=y CONFIG_KPROBES=y CONFIG_MEMCG=y CONFIG_MEMCG_SWAP=y CONFIG_PSI=y \
               CONFIG_USER_NS=y CONFIG_FAIR_GROUP_SCHED=y CONFIG_VETH=y \
               CONFIG_PID_NS=y CONFIG_NET_NS=y CONFIG_UTS_NS=y CONFIG_IPC_NS=y \
               CONFIG_OVERLAY_FS=y"
          if [ "${{ matrix.variant }}" != "control" ]; then
            REQ="$REQ CONFIG_LRU_GEN=y"
          fi
          for cfg in $REQ; do
            if ! grep -q "^$cfg$" out/.config; then
              echo "::error::Missing required config: $cfg"
              FAILED=1
            else
              echo "OK $cfg"
            fi
          done
          exit $FAILED

      - name: Compile kernel
        run: |
          cd kernel
          export ARCH=arm64
          export KBUILD_BUILD_USER=FlickerDS
          export KBUILD_BUILD_HOST=github

          make -j$(nproc) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            HOSTCC=gcc PYTHON=python3 \
            Image dtbo.img dtbs

      - name: Collect artifacts
        run: |
          cd kernel
          ls -la out/arch/arm64/boot/
          mkdir -p out/pack
          cp out/arch/arm64/boot/Image out/pack/Image
          cat out/arch/arm64/boot/dts/vendor/qcom/kona*.dtb > out/pack/dtb
          cp out/arch/arm64/boot/dtbo.img out/pack/dtbo.img
          ls -la out/pack/

      - name: Package AnyKernel3 zip
        run: |
          mkdir -p ak
          cp -r repo/anykernel/. ak/
          cp kernel/out/pack/Image ak/Image
          cp kernel/out/pack/dtb ak/dtb
          cp kernel/out/pack/dtbo.img ak/dtbo.img
          ZIP="FlickerDS-${DEVICE}-${{ matrix.variant }}-$(date +%Y%m%d-%H%M).zip"
          cd ak && zip -r9 "$ZIP" . -x '*.git*' && cd ..
          mv "ak/$ZIP" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlickerDS-${{ matrix.variant }}
          path: FlickerDS-*.zip
          if-no-files-found: error

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ZIP="$(ls FlickerDS-*.zip)"
          RELEASE="flickerds-v1.1.2-${{ matrix.variant }}-$(date +%Y%m%d-%H%M)"
          case "${{ matrix.variant }}" in
            full)    DESC="MGLRU completo com hooks sched/exec (igual v1.1.1 — referência do bootloop)";;
            nohooks) DESC="MGLRU completo SEM os hooks lru_gen_* em exec/core/exit/fork (principal candidato)";;
            control) DESC="Controle: exatamente a composição da v1.0 reconstruída hoje (isola pipeline)";;
          esac
          NOTES="## FlickerDS ${DEVICE} — variante **${{ matrix.variant }}**

          ${DESC}

          Base: otaviomorais/kernel_xiaomi_sm8250-1 @\`${KERNEL_BRANCH}\` + EEVDF pleno.
          Aging do MGLRU desligado por default em todas as variantes com MGLRU."

          gh release create "$RELEASE" "$ZIP" \
            --title "FlickerDS ${{ matrix.variant }} $(date +%Y%m%d-%H%M)" \
            --notes "$NOTES"
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/$RELEASE"
