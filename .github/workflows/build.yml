name: Build Kernel (e404 + MGLRU + MEMCG/PSI)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      device:
        description: 'Device codename'
        required: false
        default: 'alioth'

permissions:
  contents: write

concurrency:
  group: kernel-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DEVICE: ${{ github.event.inputs.device || 'alioth' }}
      KERNEL_REPO: https://github.com/kvsnr113/xiaomi_sm8250_kernel_e404
      KERNEL_BRANCH: staging-bpf

    steps:
      - name: Checkout this repo (anykernel + patches)
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources
          echo "deb http://archive.ubuntu.com/ubuntu/ noble main universe" | sudo tee /etc/apt/sources.list.d/fast.list
          echo "deb http://archive.ubuntu.com/ubuntu/ noble-updates main universe" | sudo tee -a /etc/apt/sources.list.d/fast.list
          echo "deb http://security.ubuntu.com/ubuntu/ noble-security main universe" | sudo tee -a /etc/apt/sources.list.d/fast.list
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            flex bison bc zip unzip file python3 python-is-python3 \
            libssl-dev libncurses-dev kmod cpio
          sudo ln -sf /usr/bin/python3 /usr/bin/python2 || true

      - name: Cache kernel source
        id: cache-kernel
        uses: actions/cache@v4
        with:
          path: kernel
          key: ${{ runner.os }}-e404-staging-bpf-${{ hashFiles('patches/*.patch') }}
          restore-keys: |
            ${{ runner.os }}-e404-staging-bpf-

      - name: Clone e404 kernel source (with KernelSU submodule)
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch ${{ env.KERNEL_BRANCH }} \
            ${{ env.KERNEL_REPO }}.git kernel
          cd kernel
          git submodule update --init --depth 1

      - name: Apply feature patches
        run: |
          cd kernel
          for patch in ../repo/patches/*.patch; do
            echo "==> Applying $(basename "$patch")"
            git apply --check "$patch" && git apply "$patch" || {
              echo "❌ Failed to apply $patch"
              exit 1
            }
          done
          echo "==> All patches applied successfully"

      - name: Cache Clang toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: toolchain/clang
          key: ${{ runner.os }}-clang20-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-clang20-

      - name: Download Clang (ZyCromerZ)
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchain
          cd toolchain
          curl -L -o clang.tar.gz \
            https://github.com/ZyCromerZ/Clang/releases/download/20.0.0git-20250129-release/Clang-20.0.0git-20250129.tar.gz
          mkdir -p clang && tar -xzf clang.tar.gz -C clang
          rm clang.tar.gz
          CLANG_BIN="$(pwd)/clang/bin"
          if [ ! -x "$CLANG_BIN/clang" ]; then
            CLANG_BIN="$(cd "$(find clang -name clang -path '*/bin/*' -exec dirname {} \; | head -1)" && pwd)"
          fi
          echo "Clang em: $CLANG_BIN"
          echo "$CLANG_BIN" >> "$GITHUB_PATH"

      - name: Cache GCC cross-compiler
        id: cache-gcc
        uses: actions/cache@v4
        with:
          path: toolchain/gcc
          key: ${{ runner.os }}-gcc-aarch64-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-gcc-aarch64-

      - name: Download GCC cross-compiler
        if: steps.cache-gcc.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchain/gcc
          cd toolchain/gcc
          curl -L -o gcc.tar.gz \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/android12-release.tar.gz
          tar -xf gcc.tar.gz || true
          rm gcc.tar.gz
          GCC_BIN="$(find . -name aarch64-linux-android-gcc -exec dirname {} \; | head -1)"
          if [ -n "$GCC_BIN" ]; then
            echo "$GCC_BIN" >> "$GITHUB_PATH"
          fi

      - name: Restore cached toolchains
        if: steps.cache-clang.outputs.cache-hit == 'true' || steps.cache-gcc.outputs.cache-hit == 'true'
        run: |
          if [ "${{ steps.cache-clang.outputs.cache-hit }}" == "true" ]; then
            CLANG_BIN="$(pwd)/toolchain/clang/bin"
            if [ ! -x "$CLANG_BIN/clang" ]; then
              CLANG_BIN="$(cd "$(find toolchain/clang -name clang -path '*/bin/*' -exec dirname {} \; | head -1)" && pwd)"
            fi
            echo "Clang em: $CLANG_BIN"
            echo "$CLANG_BIN" >> "$GITHUB_PATH"
          fi
          if [ "${{ steps.cache-gcc.outputs.cache-hit }}" == "true" ]; then
            GCC_BIN="$(find toolchain/gcc -name aarch64-linux-android-gcc -exec dirname {} \; | head -1)"
            if [ -n "$GCC_BIN" ]; then
              echo "$GCC_BIN" >> "$GITHUB_PATH"
            fi
          fi

      - name: Setup swap for OOM protection
        run: |
          SWAP="${RUNNER_TEMP}/swapfile"
          sudo rm -f "$SWAP"
          sudo fallocate -l 8G "$SWAP" || sudo dd if=/dev/zero of="$SWAP" bs=1M count=8192 status=progress
          sudo chmod 600 "$SWAP"
          sudo mkswap "$SWAP"
          sudo swapon "$SWAP"
          free -h

      - name: Configure kernel
        run: |
          cd kernel
          export ARCH=arm64
          export KBUILD_BUILD_USER=e404
          export KBUILD_BUILD_HOST=github

          echo "==> Generating vendor/${DEVICE}_defconfig"
          make O=out ARCH=arm64 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            HOSTCC=gcc PYTHON=python3 \
            vendor/${DEVICE}_defconfig

          echo "==> Config summary:"
          grep -E "CONFIG_KSU=|CONFIG_MEMCG=|CONFIG_PSI=|CONFIG_LRU_GEN=|CONFIG_UCLAMP_ASSIST=|CONFIG_IRQ_SBALANCE=|CONFIG_CPU_INPUT_BOOST=|CONFIG_ZRAM_DEF_COMP=|CONFIG_NTSYNC=|CONFIG_LTO_CLANG_THIN=" out/.config || true

          echo "==> Validating critical configs..."
          FAILED=0
          for cfg in CONFIG_KSU=y CONFIG_MEMCG=y CONFIG_MEMCG_SWAP=y CONFIG_PSI=y CONFIG_LRU_GEN=y CONFIG_LRU_GEN_ENABLED=y CONFIG_LTO_CLANG_THIN=y; do
            if ! grep -q "^$cfg$" out/.config; then
              echo "❌ Missing required config: $cfg"
              FAILED=1
            else
              echo "✅ $cfg"
            fi
          done
          exit $FAILED

      - name: Compile kernel
        run: |
          cd kernel
          export ARCH=arm64
          export KBUILD_BUILD_USER=e404
          export KBUILD_BUILD_HOST=github

          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            HOSTCC=gcc PYTHON=python3 \
            Image dtbo.img dtbs

      - name: Collect artifacts
        run: |
          cd kernel
          ls -la out/arch/arm64/boot/
          mkdir -p out/pack
          cp out/arch/arm64/boot/Image out/pack/Image

          # AnyKernel3 expects a single concatenated dtb file at zip root;
          # it gets patched into vendor_boot by ak3-core.sh
          cat out/arch/arm64/boot/dts/vendor/qcom/kona*.dtb > out/pack/dtb

          # Flashed to the dtbo partition automatically by write_boot
          cp out/arch/arm64/boot/dtbo.img out/pack/dtbo.img

          ls -la out/pack/

      - name: Package AnyKernel3 zip
        run: |
          mkdir -p ak
          cp -r repo/anykernel/. ak/
          cp kernel/out/pack/Image ak/Image
          cp kernel/out/pack/dtb ak/dtb
          cp kernel/out/pack/dtbo.img ak/dtbo.img
          ZIP="Kernel-${DEVICE}-e404-mglru-$(date +%Y%m%d-%H%M).zip"
          cd ak && zip -r9 "$ZIP" . -x '*.git*' && cd ..
          mv "ak/$ZIP" repo/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ env.DEVICE }}
          path: repo/Kernel-*.zip
          if-no-files-found: error

      - name: Create Release
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="$(ls Kernel-*.zip)"
          RELEASE="e404-mglru-v1.0.0-$(date +%Y%m%d-%H%M)"
          NOTES="## Kernel for ${DEVICE} — e404 staging-bpf + MGLRU + MEMCG/PSI

          **Base**: kvsnr113/xiaomi_sm8250_kernel_e404 (\`${KERNEL_BRANCH}\`, 4.19.404-R)
          **Portado do Flicker**: série MGLRU completa (27 commits, adaptada à API pagewalk moderna)

          **Fixes de memória** (do MagicTime):
          - MEMCG + MEMCG_SWAP habilitados (contabilidade por cgroup p/ lmkd/DroidSpaces)
          - PSI habilitado (pressure stall information p/ lmkd)

          **Recursos nativos da base e404**:
          - EEVDF + CASS scheduler
          - KernelSU (xxksu) integrado
          - SBalance IRQ balancer
          - Uclamp Assist
          - CPU Input Boost
          - ZRAM zstd + writeback
          - BPF backport 5.15 (Android 16/17 ROMs)

          **Flash via TWRP/Recovery ou AnyKernel-compatible**

          ⚠️ Teste em device: MGLRU + MEMCG alteram o comportamento de reclaim."

          gh release create "$RELEASE" "$ZIP" \
            --title "Kernel ${DEVICE} — e404+MGLRU $(date +%Y%m%d-%H%M)" \
            --notes "$NOTES"
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/$RELEASE"
