name: Build Flicker Kernel (alioth - KSU + DroidSpaces)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      device:
        description: 'Device codename'
        required: false
        default: 'alioth'
      enable_ksu:
        description: 'Enable KernelSU (true/false)'
        required: false
        default: 'true'
      enable_droidspaces:
        description: 'Enable DroidSpaces configs (true/false)'
        required: false
        default: 'true'

permissions:
  contents: write

concurrency:
  group: flicker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DEVICE: ${{ github.event.inputs.device || 'alioth' }}
      ENABLE_KSU: ${{ github.event.inputs.enable_ksu || 'true' }}
      ENABLE_DROIDSPACES: ${{ github.event.inputs.enable_droidspaces || 'true' }}

    steps:
      - name: Checkout this repo (anykernel + configs)
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install dependencies
        run: |
          # Remove slow/irrelevant repos to speed up apt
          sudo rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources
          echo "deb http://archive.ubuntu.com/ubuntu/ noble main universe" | sudo tee /etc/apt/sources.list.d/fast.list
          echo "deb http://archive.ubuntu.com/ubuntu/ noble-updates main universe" | sudo tee -a /etc/apt/sources.list.d/fast.list
          echo "deb http://security.ubuntu.com/ubuntu/ noble-security main universe" | sudo tee -a /etc/apt/sources.list.d/fast.list
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            flex bison bc zip unzip file python3 python-is-python3 \
            libssl-dev libncurses-dev kmod cpio
          sudo ln -sf /usr/bin/python3 /usr/bin/python2 || true

      - name: Cache kernel source
        id: cache-kernel
        uses: actions/cache@v4
        with:
          path: kernel
          key: ${{ runner.os }}-kernel-sm8250-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-kernel-sm8250-

      - name: Clone Flicker kernel source
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch sixteen-qpr2 \
            https://github.com/Flicker-Android-Devices/kernel_xiaomi_sm8250.git kernel

      - name: Cache Clang toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: toolchain/clang
          key: ${{ runner.os }}-clang20-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-clang20-

      - name: Download Clang (ZyCromerZ)
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchain
          cd toolchain
          curl -L -o clang.tar.gz \
            https://github.com/ZyCromerZ/Clang/releases/download/20.0.0git-20250129-release/Clang-20.0.0git-20250129.tar.gz
          mkdir -p clang && tar -xzf clang.tar.gz -C clang
          rm clang.tar.gz
          CLANG_BIN="$(pwd)/clang/bin"
          if [ ! -x "$CLANG_BIN/clang" ]; then
            CLANG_BIN="$(cd "$(find clang -name clang -path '*/bin/*' -exec dirname {} \; | head -1)" && pwd)"
          fi
          echo "Clang em: $CLANG_BIN"
          echo "$CLANG_BIN" >> "$GITHUB_PATH"

      - name: Cache GCC cross-compiler
        id: cache-gcc
        uses: actions/cache@v4
        with:
          path: toolchain/gcc
          key: ${{ runner.os }}-gcc-aarch64-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-gcc-aarch64-

      - name: Download GCC cross-compiler
        if: steps.cache-gcc.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchain/gcc
          cd toolchain/gcc
          curl -L -o gcc.tar.gz \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/android12-release.tar.gz
          tar -xf gcc.tar.gz || true
          rm gcc.tar.gz
          GCC_BIN="$(find . -name aarch64-linux-android-gcc -exec dirname {} \; | head -1)"
          if [ -n "$GCC_BIN" ]; then
            echo "$GCC_BIN" >> "$GITHUB_PATH"
          fi

      - name: Restore cached toolchains
        if: steps.cache-clang.outputs.cache-hit == 'true' || steps.cache-gcc.outputs.cache-hit == 'true'
        run: |
          if [ "${{ steps.cache-clang.outputs.cache-hit }}" == "true" ]; then
            CLANG_BIN="$(pwd)/toolchain/clang/bin"
            if [ ! -x "$CLANG_BIN/clang" ]; then
              CLANG_BIN="$(cd "$(find toolchain/clang -name clang -path '*/bin/*' -exec dirname {} \; | head -1)" && pwd)"
            fi
            echo "Clang em: $CLANG_BIN"
            echo "$CLANG_BIN" >> "$GITHUB_PATH"
          fi
          if [ "${{ steps.cache-gcc.outputs.cache-hit }}" == "true" ]; then
            GCC_BIN="$(find toolchain/gcc -name aarch64-linux-android-gcc -exec dirname {} \; | head -1)"
            if [ -n "$GCC_BIN" ]; then
              echo "$GCC_BIN" >> "$GITHUB_PATH"
            fi
          fi

      - name: Setup KernelSU
        if: env.ENABLE_KSU == 'true'
        run: |
          cd kernel
          echo "==> KernelSU already present at drivers/kernelsu"
          echo "==> Enabling CONFIG_KSU in defconfig"
          if ! grep -q "CONFIG_KSU" arch/arm64/configs/${{ env.DEVICE }}_defconfig; then
            echo "CONFIG_KSU=y" >> arch/arm64/configs/${{ env.DEVICE }}_defconfig
          fi

      - name: Setup swap for OOM protection
        run: |
          SWAP="${RUNNER_TEMP}/swapfile"
          sudo rm -f "$SWAP"
          sudo fallocate -l 8G "$SWAP" || sudo dd if=/dev/zero of="$SWAP" bs=1M count=8192 status=progress
          sudo chmod 600 "$SWAP"
          sudo mkswap "$SWAP"
          sudo swapon "$SWAP"
          free -h

      - name: Configure kernel
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=Flicker
          export KBUILD_BUILD_HOST=github

          echo "==> Generating ${{ env.DEVICE }}_defconfig"
          make O=out \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM=1 LLVM_IAS=1 \
            HOSTCC=gcc \
            PYTHON=python3 \
            ${{ env.DEVICE }}_defconfig

          echo "==> Defconfig generated"

          # Switch from Full LTO to ThinLTO (much less RAM during link)
          echo "==> Enabling ThinLTO for GitHub runner"
          scripts/config --file out/.config \
            -e THINLTO

          # Enable DroidSpaces features if requested
          if [ "${{ env.ENABLE_DROIDSPACES }}" == "true" ]; then
            echo "==> Enabling DroidSpaces configs"
            scripts/config --file out/.config \
              -e NAMESPACES \
              -e PID_NS \
              -e UTS_NS \
              -e IPC_NS \
              -e USER_NS \
              -e NET_NS \
              -e CGROUPS \
              -e CGROUP_DEVICE \
              -e CGROUP_PIDS \
              -e MEMCG \
              -e MEMCG_SWAP \
              -e CGROUP_SCHED \
              -e FAIR_GROUP_SCHED \
              -e CGROUP_FREEZER \
              -e CGROUP_NET_PRIO \
              -e CGROUP_NET_CLASSID \
              -e CGROUP_CPUACCT \
              -e BLK_CGROUP \
              -e CGROUP_BPF \
              -e VETH \
              -e BRIDGE \
              -e BRIDGE_NETFILTER \
              -e NETFILTER \
              -e NF_CONNTRACK \
              -e IP_NF_IPTABLES \
              -e IP_NF_FILTER \
              -e NF_NAT \
              -e NF_TABLES \
              -e IP_NF_TARGET_MASQUERADE \
              -e NETFILTER_XT_TARGET_MASQUERADE \
              -e NF_CONNTRACK_NETLINK \
              -e OVERLAY_FS \
              -e SECCOMP \
              -e SECCOMP_FILTER \
              -e CHECKPOINT_RESTORE \
              -e POSIX_MQUEUE \
              -e SYSVIPC \
              -e FHANDLE \
              -e NET_L3_MASTER_DEV \
              -e VLAN_8021Q \
              -e BRIDGE_VLAN_FILTERING \
              -e VXLAN \
              -e IPVLAN \
              -e MACVLAN \
              -e DM_THIN_PROVISIONING \
              -e BINFMT_MISC \
              -e FW_LOADER \
              -e FW_LOADER_USER_HELPER \
              -e FW_LOADER_COMPRESS \
              -e TMPFS_POSIX_ACL \
              -e TMPFS_XATTR \
              -e PERSISTENT_KEYRINGS \
              -e ENCRYPTED_KEYS \
              -e UNIX_DIAG \
              -e PACKET_DIAG \
              -e NETLINK_DIAG \
              -e CGROUP_HUGETLB \
              -e PROC_CHILDREN \
              -e TASK_IO_ACCOUNTING
          fi

          # NOTE: ZRAM compression is set at runtime via sysfs (not in 4.19 defconfig)
          # To enable zstd: echo zstd > /sys/block/zram0/comp_algorithm

          echo "==> Running olddefconfig"
          make O=out \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM=1 LLVM_IAS=1 \
            HOSTCC=gcc \
            PYTHON=python3 \
            olddefconfig

          echo "==> Config summary:"
          grep -E "CONFIG_KSU|CONFIG_LRU_GEN|CONFIG_UCLAMP|CONFIG_NTSYNC|CONFIG_OVERLAY_FS|CONFIG_NAMESPACES|CONFIG_CGROUPS|CONFIG_SECCOMP|CONFIG_ZRAM_DEF_COMP|CONFIG_PID_NS|CONFIG_USER_NS|CONFIG_NET_NS|CONFIG_IO_URING" out/.config || true
          echo "==> Validating critical configs..."
          for cfg in CONFIG_KSU=y CONFIG_THINLTO=y CONFIG_UCLAMP_TASK=y CONFIG_LRU_GEN_ENABLED=y CONFIG_NTSYNC=y CONFIG_OVERLAY_FS=y; do
            if ! grep -q "$cfg" out/.config; then
              echo "❌ Missing required config: $cfg"
              exit 1
            fi
            echo "✅ $cfg"
          done

      - name: Compile objects
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=Flicker
          export KBUILD_BUILD_HOST=github

          echo "==> Compiling all objects (parallel)"
          make -j4 O=out \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM=1 LLVM_IAS=1 \
            HOSTCC=gcc \
            PYTHON=python3 \
            Image dtbs modules

      - name: Collect artifacts
        run: |
          cd kernel
          ls -la out/arch/arm64/boot/
          mkdir -p out/pack
          cp out/arch/arm64/boot/Image out/pack/Image

          # DTBs
          if ls out/arch/arm64/boot/dts/vendor/qcom/*.dtb 1>/dev/null 2>&1; then
            echo "==> Copying DTBs"
            cp out/arch/arm64/boot/dts/vendor/qcom/*.dtb out/pack/ 2>/dev/null || true
          fi

          # DTBO
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img out/pack/dtbo.img
          fi

          ls -la out/pack/

      - name: Package AnyKernel + modules
        run: |
          mkdir -p ak
          cp -r repo/anykernel/. ak/
          cp kernel/out/arch/arm64/boot/Image ak/Image
          if ls kernel/out/arch/arm64/boot/dts/vendor/qcom/*.dtb 1>/dev/null 2>&1; then
            cp kernel/out/arch/arm64/boot/dts/vendor/qcom/*.dtb ak/ 2>/dev/null || true
          fi
          if [ -f kernel/out/arch/arm64/boot/dtbo.img ]; then
            cp kernel/out/arch/arm64/boot/dtbo.img ak/dtbo.img
          fi
          # Install kernel modules
          make -C kernel O=out \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            LLVM=1 LLVM_IAS=1 HOSTCC=gcc PYTHON=python3 \
            INSTALL_MOD_PATH=$(pwd)/../ak-modules modules_install 2>/dev/null || true
          if [ -d "../ak-modules/lib/modules" ] && [ "$(ls ../ak-modules/lib/modules/ 2>/dev/null | head -1)" ]; then
            echo "==> Copying kernel modules"
            cp -a ../ak-modules/lib ak/lib/modules
          fi
          cd ak
          ZIP="Flicker-${DEVICE}-KSU-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "$ZIP" . -x '*.git*'
          mv "$ZIP" "$GITHUB_WORKSPACE/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flicker-${{ env.DEVICE }}
          path: Flicker-*.zip
          if-no-files-found: error

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="$(ls Flicker-*.zip)"
          RELEASE="flicker-v1.0.0-$(date +%Y%m%d-%H%M)"
          NOTES="## Flicker Kernel for $DEVICE

          **Base**: Flicker-Android-Devices/kernel_xiaomi_sm8250 (sixteen-qpr2)
          **Features**:
          - KernelSU integrated (drivers/kernelsu)
          - DroidSpaces support (cgroups, namespaces, overlayfs, networking)
          - Uclamp + PELT scheduler
          - ThinLTO (Clang)
          - MGLRU (Multi-Gen LRU)
          - NTSync (Wine/Proton)
          - BBR/TCP congestion control
          - ZRAM with writeback (compression configurable at runtime via sysfs)

          **Flash via TWRP/Recovery**"

          gh release create "$RELEASE" "$ZIP" \
            --title "Flicker Kernel $DEVICE — KSU + DroidSpaces $(date +%Y%m%d-%H%M)" \
            --notes "$NOTES"
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/$RELEASE"
